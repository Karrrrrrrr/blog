<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空动画</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #starry-sky {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #000000, #1a1a4d);
            position: relative;
            overflow: hidden;
        }

        .star {
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 5px #fff;
            transform: translateX(var(--x)) translateY(var(--y));
        }
    </style>
</head>

<body>
<div id="starry-sky"></div>
<script>
    const starrySky = document.getElementById('starry-sky');
    const numStars = 200; // 星星数量
    const positionMap = new Map
    const { height, width } = starrySky.getBoundingClientRect();
    function createStars() {
        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            // 随机初始位置
            const x = Math.random() * width;
            const y = Math.random() * height;
            positionMap.set(star, { x, y })
            // star.style.left = x + 'px';
            // star.style.top = y + 'px';
            // 随机大小
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            // 随机颜色
            const colors = ['#fff', '#f0f', '#0ff', '#ff0'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            star.style.backgroundColor = randomColor;
            // 随机移动速度
            const speedX = Math.random() * 2 + 1;
            const speedY = Math.random() * 2 + 1;
            star.dataset.speedX = speedX;
            star.dataset.speedY = speedY;
            starrySky.appendChild(star);
        }
    }



    function moveStars() {
        const stars = document.querySelectorAll('.star');
        stars.forEach((star) => {
            let { x, y } = positionMap.get(star)
            x += parseFloat(star.dataset.speedX);
            y -= parseFloat(star.dataset.speedY);
            if (x > width) x = 0
            if (y < 0) y = height

            positionMap.set(star, { x, y })
            star.style.setProperty('--y', y + 'px');
            star.style.setProperty('--x', x + 'px');
        });
    }

    createStars();
    setInterval(moveStars, 50);
</script>
</body>

</html>
